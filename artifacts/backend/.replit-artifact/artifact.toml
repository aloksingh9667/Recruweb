kind = "api"
previewPath = "/api"
title = "Backend"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "Backend Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/backend run dev"

[services.production]

[services.production.build]
args = ["echo", "no build needed"]

[services.production.run]
args = ["node", "artifacts/backend/src/index.js"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
